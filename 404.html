<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Estilos específicos apenas para o Layout da 404 */
        body, html {
            height: 100%;
            margin: 0;
        }

        .container-404 {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .lado-foto {
            flex: 1;
            background-image: url('/img/404.jpg');
            background-size: cover;
            background-position: center;
        }

        .lado-preto {
            flex: 1;
            background-color: #000; /* Bloco preto solicitado */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5%;
            text-align: center;
        }

        /* Aqui você usa as tags que já existem no seu style.css */
        .lado-preto h1 {
            font-size: 6rem; /* Ajuste apenas o tamanho se necessário */
            margin-bottom: 0.5rem;
        }

        /* Estilo para celulares */
        @media (max-width: 768px) {
            .container-404 {
                flex-direction: column;
            }
            .lado-foto {
                height: 40%;
                flex: none;
            }
        }
    </style>
</head>
<body>

<div class="container-404" style="display: flex !important; flex-direction: row !important; height: 100vh; width: 100%; margin: 0; padding: 0;">

    <div class="lado-foto" 
         style="flex: 1 !important; 
                height: 100vh !important;
                background-image: url('/img/404.jpg') !important; 
                background-size: cover !important; 
                background-position: center !important;">
    </div>

    <div class="lado-preto" 
         style="flex: 1 !important; 
                height: 100vh !important;
                background-color: #000 !important; 
                color: #fff !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                text-align: center !important;
                padding: 40px !important;">
        
        <img src="/img/logo-white.webp" alt="Logo" style="max-width: 150px; margin-bottom: 20px;">
        
        <h1 style="color: #fff !important; font-size: 8rem; margin: 0; line-height: 1;">404</h1>
        <p style="color: #fff !important; font-size: 1.5rem; margin-bottom: 30px;">Essa página não existe.</p>
        
        <a href="/" style="background-color: #fff !important; color: #000 !important; padding: 15px 40px; text-decoration: none; font-weight: bold; border-radius: 5px;">
            VOLTAR
        </a>
    </div>

</div>

</body>
</html>
