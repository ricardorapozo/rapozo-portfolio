<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 — Página não encontrada</title>

	<link rel="stylesheet" href="/css/style.css">

	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden; /* Evita scroll desnecessário */
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Lado Esquerdo: Imagem */
        .lado-esquerdo {
            flex: 1;
            background-image: url('/img/404.jpg'); /* Substitua aqui */
            background-size: cover;
            background-position: center;
        }

        /* Lado Direito: Bloco Preto */
        .lado-direito {
            flex: 1;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .logo {
            max-width: 150px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 8rem;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .btn-voltar {
            padding: 15px 40px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background-color: #ccc;
        }

        /* Responsividade para celulares */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .lado-esquerdo {
                display: none; /* Opcional: esconde a foto no mobile para focar no erro */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lado-esquerdo"></div>

        <div class="lado-direito">
            <img src="/img/logo-white.webp" alt="Logo" class="logo">
            <h1>404</h1>
            <p>Essa página não existe.</p>
            <a href="/" class="btn-voltar">VOLTAR</a>
        </div>
    </div>

</body>
</html>
