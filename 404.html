<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* Aplicando a Oswald em tudo que for texto dentro da 404 */
        .container-404, .container-404 h1, .container-404 p, .container-404 a {
            font-family: 'Oswald', sans-serif !important;
            text-transform: uppercase; /* A Oswald costuma ficar ótima em maiúsculas */
        }
    </style>
</head>
<body>

<div class="container-404" style="display: flex !important; flex-direction: row !important; height: 100vh; width: 100%; margin: 0; padding: 0;">

    <div class="lado-foto" 
         style="flex: 1 !important; 
                height: 100vh !important;
                background-image: url('/img/404.jpg') !important; 
                background-size: cover !important; 
                background-position: center !important;">
    </div>

    <div class="lado-preto" 
         style="flex: 1 !important; 
                height: 100vh !important;
                background-color: #000 !important; 
                color: #fff !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                text-align: center !important;
                padding: 40px !important;">
        
        <img src="/img/logo-white.webp" alt="Logo" style="max-width: 150px; margin-bottom: 20px;">
        
        <h1 style="color: #fff !important; font-size: 8rem; margin: 0; line-height: 1; font-weight: 700;">404</h1>
        <p style="color: #fff !important; font-size: 1.5rem; margin-bottom: 30px; letter-spacing: 2px;">Essa página não existe.</p>
        
        <a href="/" style="background-color: #fff !important; color: #000 !important; padding: 15px 40px; text-decoration: none; font-weight: bold; border-radius: 0px; letter-spacing: 1px;">
            VOLTAR
        </a>
    </div>

</div>

</body>
</html>
