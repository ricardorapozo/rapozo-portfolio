<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Estilos específicos apenas para o Layout da 404 */
        body, html {
            height: 100%;
            margin: 0;
        }

        .container-404 {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .lado-foto {
            flex: 1;
            background-image: url('/img/404.jpg');
            background-size: cover;
            background-position: center;
        }

        .lado-preto {
            flex: 1;
            background-color: #000; /* Bloco preto solicitado */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5%;
            text-align: center;
        }

        /* Aqui você usa as tags que já existem no seu style.css */
        .lado-preto h1 {
            font-size: 6rem; /* Ajuste apenas o tamanho se necessário */
            margin-bottom: 0.5rem;
        }

        /* Estilo para celulares */
        @media (max-width: 768px) {
            .container-404 {
                flex-direction: column;
            }
            .lado-foto {
                height: 40%;
                flex: none;
            }
        }
    </style>
</head>
<body>

    <div class="container-404">
        <div class="lado-foto"></div>

        <div class="lado-preto"> 
            <img src="/img/logo-white.webp" alt="Logo" class="sua-classe-de-logo">
            
            <h1>401</h1>
            <p>Essa página não existe.</p>
            
            <a href="/" class="c-btn fullwidth-liquid">VOLTAR</a>
        </div>
    </div>

</body>
</html>
