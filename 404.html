<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4DE20FKJW4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4DE20FKJW4');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* Aplicando a Oswald em tudo que for texto dentro da 404 */
        .container-404, .container-404 h1, .container-404 p, .container-404 a {
            font-family: 'Oswald', sans-serif !important;
            text-transform: uppercase; /* A Oswald costuma ficar ótima em maiúsculas */
        }
    </style>
    <script>
    function goBack(e) {
        e.preventDefault();

        if (document.referrer && document.referrer !== window.location.href) {
            history.back();
        } else {
            window.location.href = "/";
        }
    }
    </script>
</head>
<body>

<style>
    /* Importante: Definir a fonte e o comportamento base */
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Oswald', sans-serif !important;
    }

    /* O CONTAINER PRINCIPAL */
    .container-404 {
        display: flex;
        flex-direction: row; /* Lado a lado no Desktop */
        width: 100%;
        height: 100vh;
    }

    .lado-foto {
        flex: 1;
        background-image: url('/img/404.jpg');
        background-size: cover;
        background-position: center;
        min-height: 50vh; /* Garante que a foto apareça no mobile */
    }

    .lado-preto {
        flex: 1;
        background-color: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
    }

    /* Estilização dos textos com a Oswald */
    .lado-preto h1 {
        font-size: 8rem;
        margin: 0;
        line-height: 1;
        font-weight: 700;
        color: #fff !important;
    }

    .lado-preto p {
        font-size: 1.5rem;
        margin-bottom: 30px;
        color: #fff !important;
        text-transform: uppercase;
    }

    .btn-voltar {
        background-color: #fff !important;
        color: #000 !important;
        padding: 15px 40px;
        text-decoration: none;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* A MÁGICA DO MOBILE */
    @media (max-width: 768px) {
        .container-404 {
            flex-direction: column; /* Foto em cima, bloco preto embaixo */
        }
        
        .lado-foto {
            flex: none;
            height: 40vh; /* Define um tamanho fixo para a foto no topo */
        }

        .lado-preto {
            flex: 1;
            padding: 20px;
        }

        .lado-preto h1 {
            font-size: 5rem; /* Diminui o 404 para não quebrar a tela */
        }
    }
</style>

<div class="container-404">
    <div class="lado-foto"></div>

    <div class="lado-preto">
        <img src="/img/logo-white.webp" alt="Logo" style="max-width: 120px; margin-bottom: 20px;">
        <h1>404</h1>
        <p>Essa página não existe.</p>
        <a href="#" class="btn-voltar" onclick="goBack(event)">VOLTAR</a>
    </div>
</div>

</body>
</html>
